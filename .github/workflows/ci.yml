name: CI

# Прогон тестов и smoke-проверки при каждом push / PR.
# Локально PHP нет (см. CLAUDE.md) — phpunit здесь единственный быстрый способ
# поймать регрессию до выкладки на abconsult.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  residents-phpunit:
    name: "residents: phpunit"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: residents
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Тесты ходят в SQLite in-memory (tests/schema.sqlite.sql)
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  astro-smoke:
    name: "astro: check + build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Astro 7 требует Node >= 22.12 (как локально, так и на сервере)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Типизация .astro/.ts — ловит ошибки в шаблонах и getStaticPaths
      - name: astro check
        run: npm run check

      # Полная статическая сборка — главный smoke-тест Astro-части
      - name: astro build
        run: npm run build
