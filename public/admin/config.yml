# Decap CMS — редактор контента сайта «Сказочный Край».
# Сгенерировано scripts/gen-decap-config.mjs — правьте генератор, не этот файл.

backend:
  name: github
  repo: digistaff-team/skaz-kray-astro
  branch: main
  auth_type: pkce
  app_id: Iv23liz6rGBelKFXn0Ha

# Локальное редактирование при разработке:
#   1) npx decap-server   2) npm run dev   3) открыть http://localhost:4321/admin/index.html
local_backend: true

locale: ru
site_url: https://skaz-kray.ru
display_url: https://skaz-kray.ru
media_folder: "public/wp-content/uploads/decap"
public_folder: "/wp-content/uploads/decap"

collections:
  - name: posts
    label: "Записи (дневники, новости, статьи)"
    label_singular: "Запись"
    description: "Дневники поместий, новости и статьи."
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Заголовок", widget: string }
      - { name: date, label: "Дата", widget: datetime, date_format: "YYYY-MM-DD", time_format: "HH:mm:ss", format: "YYYY-MM-DD HH:mm:ss" }
      - { name: excerpt, label: "Краткое описание (для карточек)", widget: text, required: false }
      - name: categories
        label: "Рубрики"
        widget: select
        multiple: true
        required: false
        options:
          - { label: "Дневники поместий", value: "dnevniki-pomestij" }
          - { label: "Новости", value: "novosti" }
          - { label: "Статьи", value: "stati" }
          - { label: "Без рубрики", value: "bez-rubriki" }
          - { label: "Поместье Грушко «Дубы колдуны»", value: "pomeste-grushko-duby-kolduny" }
          - { label: "Поместье Руденко «АгудариЯ»", value: "pomeste-rudenko-agudariya" }
          - { label: "Поместье Кисловых", value: "pomeste-schastlivoe" }
          - { label: "Поместье Альховских «Мечта»", value: "pomeste-alxovskix-mechta" }
          - { label: "Поместье Малиновских", value: "pomeste-malinovskix" }
          - { label: "Поместье «Долина яблонь»", value: "pomeste-dolina-yablon" }
          - { label: "Поместье «Славное»", value: "pomeste-slavnoe" }
          - { label: "Поместье Шаниных", value: "pomeste-shaninyx" }
          - { label: "Поместье «АНДРиКа»", value: "pomeste-andrika" }
          - { label: "Поместье «Музыка Ветра»", value: "pomeste-muzyka-vetra" }
          - { label: "Поместье «Сказочные Терема»", value: "pomeste-skazochnye-terema" }
          - { label: "Поместье «Вишнёвый сад»", value: "pomeste-vishnyovyj-sad" }
          - { label: "Поместье Беккеров", value: "pomeste-bekkerov" }
          - { label: "Поместье «Сад Мечты»", value: "pomeste-sad-mechty" }
          - { label: "Поместье «Ура»", value: "pomeste-ura" }
          - { label: "Поместье Шевцовых", value: "pomeste-shevcovyx" }
          - { label: "Поместье «Процветания»", value: "procvetaniya" }
          - { label: "«Сказочные» репортажи", value: "skazochnye-reportazhi" }
          - { label: "Копилка знаний", value: "kopilka-znanij" }
          - { label: "Сказочная кухня", value: "cuisine" }
          - { label: "Растения Сказочного Края", value: "rasteniya-skazochnogo-kraya" }
          - { label: "Сказочная эко-продукция", value: "skazochnaya-eko-produkciya" }
      - { name: cover, label: "Обложка (URL картинки)", widget: string, required: false }
      - { name: seoTitle, label: "SEO: заголовок", widget: string, required: false }
      - { name: seoDescription, label: "SEO: описание", widget: text, required: false }
      - { name: body, label: "Текст", widget: markdown }

  - name: pages
    label: "Страницы"
    label_singular: "Страница"
    description: "Обычные страницы сайта (О нас, Правила и т.д.)."
    folder: "src/content/pages"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { name: title, label: "Заголовок", widget: string }
      - { name: permalink, label: "Адрес страницы (URL)", widget: string, hint: "например /o-nas/pravila/ — со слэшами" }
      - { name: date, label: "Дата", widget: datetime, required: false, date_format: "YYYY-MM-DD", time_format: "HH:mm:ss", format: "YYYY-MM-DD HH:mm:ss" }
      - { name: seoTitle, label: "SEO: заголовок", widget: string, required: false }
      - { name: seoDescription, label: "SEO: описание", widget: text, required: false }
      - { name: body, label: "Текст", widget: markdown }
