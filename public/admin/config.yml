# Decap CMS — редактор контента сайта «Сказочный Край».
# Сгенерировано scripts/gen-decap-config.mjs — правьте генератор, не этот файл.

backend:
  name: github
  repo: digistaff-team/skaz-kray-astro
  branch: main
  base_url: https://skaz-kray.ru
  auth_endpoint: oauth/auth

# Локальное редактирование при разработке:
#   1) npx decap-server   2) npm run dev   3) открыть http://localhost:4321/admin/index.html
local_backend: true

locale: ru
site_url: https://skaz-kray.ru
display_url: https://skaz-kray.ru
media_folder: "public/wp-content/uploads/decap"
public_folder: "/wp-content/uploads/decap"

collections:
  - name: novosti
    label: "Новости"
    label_singular: "Новость"
    description: "Быстрая заметка в раздел «Новости» на сайте. Заполните заголовок и текст — остальное подставится само."
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Заголовок новости", widget: string }
      - { name: date, label: "Дата публикации", widget: datetime, default: "{{now}}", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss", format: "YYYY-MM-DD HH:mm:ss" }
      - { name: body, label: "Текст новости", widget: markdown }
      - { name: categories, widget: hidden, default: ["novosti"] }

  - name: art-stati
    label: "Статьи"
    label_singular: "Статья"
    description: "Статьи в рубрику «Статьи». Заполните заголовок и текст — рубрика подставится сама."
    folder: "src/content/posts"
    create: true
    filter: { field: categories, value: "stati" }
    slug: "{{slug}}"
    identifier_field: title
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Заголовок", widget: string }
      - { name: date, label: "Дата публикации", widget: datetime, default: "{{now}}", date_format: "YYYY-MM-DD", time_format: "HH:mm:ss", format: "YYYY-MM-DD HH:mm:ss" }
      - { name: excerpt, label: "Краткое описание (для карточек)", widget: text, required: false }
      - { name: cover, label: "Обложка (URL картинки)", widget: string, required: false }
      - { name: body, label: "Текст", widget: markdown }
      - { name: categories, widget: hidden, default: ["stati"] }

  - name: art-skazochnye-reportazhi
    label: "«Сказочные» репортажи"
    label_singular: "Статья"
